<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FNB app · Mercer (concept)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mercer.css">
  <style>
    /* On a computer the app sits in a phone-sized frame; on a real phone it fills the screen. */
    body { min-height: 100vh; display: grid; place-items: center; background: #DDE3EC; }
    :root[data-theme="dark"] body { background: #05080F; }
    .phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 44px; background: var(--page);
             box-shadow: 0 40px 100px rgba(0,20,50,.35), 0 0 0 10px #111; display: flex; flex-direction: column; }
    @media (max-width: 500px) {
      body { display: block; }
      .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    }
    .app-top { background: var(--navy); color: #fff; padding: 22px 20px 26px; }
    .app-top p { margin: 0; }
    .stripe { height: 4px; background: var(--crimson); }
    .app-main { flex: 1; min-height: 0; overflow: auto; padding: 18px 16px 90px; display: flex; flex-direction: column; gap: 14px; }
    .quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .quick button { min-height: 64px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); font-size: 12px; font-weight: 500; cursor: pointer; transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
    .quick button:active { transform: scale(.92); }
    .tabs { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 6px 24px; }
    .tabs a { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); text-decoration: none; }
    .tabs a[aria-current] { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body class="t">
  <div class="phone t">
    <header class="app-top">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <strong style="font-size:17px;letter-spacing:-.01em">First National Bank</strong>
        <span style="font-size:11px;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:999px">Concept</span>
      </div>
      <p style="margin-top:18px;font-size:13px;color:#D6E0EE">Checking available</p>
      <p class="mono" style="margin-top:2px;font-size:34px;letter-spacing:-.02em" data-m="checking">–</p>
    </header>
    <div class="stripe"></div>

    <main class="app-main">
      <div class="quick">
        <button type="button">Transfer</button><button type="button">Pay bills</button><button type="button">Deposit</button><button type="button">Cards</button>
      </div>
      <div class="card" style="padding:4px 16px">
        <div class="row" style="border-top:0;padding:14px 0"><span>Checking <span data-m="checkingMask"></span></span><span class="mono" data-m="checking">–</span></div>
        <div class="row" style="padding:14px 0"><span>Savings <span data-m="savingsMask"></span></span><span class="mono" data-m="savings">–</span></div>
      </div>
      <div class="card" style="padding:4px 16px">
        <p style="margin:12px 0 2px;font-weight:600">Recent activity</p>
        <div data-m="activity" style="font-size:14px"></div>
      </div>
    </main>

    <nav class="tabs" aria-label="App">
      <a href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>Pay</a>
      <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Accounts</a>
      <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
    </nav>

    <!-- Mercer floats over the app (positioned inside .phone) -->
    <div id="mercer"></div>
  </div>

  <!-- All local: works offline. vendor/ = Preact 10.24.3 + htm 3.1.1 -->
  <script src="vendor/preact.umd.js"></script>
  <script src="vendor/htm.umd.js"></script>
  <script src="data.js"></script>
  <script src="brain.js"></script>
  <script src="mercer.js"></script>
  <script>Mercer.mount(document.getElementById('mercer'), { mode: 'phone', botName: 'Mercer', startOpen: false });</script>
</body>
</html>
